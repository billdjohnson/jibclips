name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement turns Pages on (and points it at Actions) the first time
      # this runs, so the site does not need to be enabled by hand first.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site is plain HTML/CSS at the repo root, so there is nothing to
      # build — upload the checkout as-is.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
